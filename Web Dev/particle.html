<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to Apple ID</title>
    <style>
        :root {
            --bg-top: #f5f7fb;
            --bg-bottom: #e8edf5;
            --panel: #ffffff;
            --text-primary: #1d1d1f;
            --text-secondary: #6e6e73;
            --border: #d2d2d7;
            --focus: #0071e3;
            --button: #0071e3;
            --button-hover: #0062c4;
            --shadow-soft: 0 24px 60px rgba(17, 24, 39, 0.16);
            --shadow-hard: 0 6px 16px rgba(17, 24, 39, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text-primary);
            background:
                radial-gradient(1400px 800px at -8% -20%, #ffffff, transparent 60%),
                radial-gradient(1200px 700px at 110% 120%, #ffffff, transparent 55%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            padding: 24px;
        }

        .login-shell {
            position: relative;
            width: min(100%, 430px);
            padding: 36px;
            border-radius: 26px;
            background: linear-gradient(180deg, #ffffff, #fbfcff);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: var(--shadow-soft), inset 0 1px 0 #ffffff;
        }

        .logo {
            width: 42px;
            height: 42px;
            margin: 0 auto 14px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            background: #111;
            color: #fff;
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 0.01em;
            box-shadow: var(--shadow-hard);
        }

        h1 {
            margin: 0;
            font-size: clamp(1.6rem, 2.8vw, 2rem);
            font-weight: 620;
            text-align: center;
            letter-spacing: -0.01em;
        }

        .subtitle {
            margin: 10px 0 26px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.97rem;
            line-height: 1.5;
        }

        form {
            display: grid;
            gap: 12px;
        }

        .field-wrap {
            display: grid;
            gap: 8px;
        }

        label {
            font-size: 0.86rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        input {
            width: 100%;
            border: 1px solid var(--border);
            background: #fff;
            color: var(--text-primary);
            border-radius: 14px;
            padding: 14px 16px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input::placeholder {
            color: #a1a1a6;
        }

        input:focus {
            border-color: var(--focus);
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.18);
        }

        .row {
            margin-top: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .row a {
            color: var(--focus);
            text-decoration: none;
        }

        .row a:hover {
            text-decoration: underline;
        }

        .remember {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            user-select: none;
        }

        .remember input {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            accent-color: var(--focus);
        }

        .submit {
            margin-top: 10px;
            border: 0;
            border-radius: 999px;
            background: var(--button);
            color: #fff;
            padding: 13px 20px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 8px 22px rgba(0, 113, 227, 0.35);
        }

        .submit:hover {
            background: var(--button-hover);
            transform: translateY(-1px);
        }

        .submit:active {
            transform: translateY(0);
        }

        .create {
            margin-top: 18px;
            text-align: center;
            font-size: 0.92rem;
            color: var(--text-secondary);
        }

        .create a {
            color: var(--focus);
            text-decoration: none;
            font-weight: 500;
        }

        .create a:hover {
            text-decoration: underline;
        }

        @media (max-width: 520px) {
            .login-shell {
                padding: 26px 20px;
                border-radius: 20px;
            }

            .row {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <main class="login-shell" role="main">
        <div class="logo" aria-hidden="true">A</div>
        <h1>Sign in with Apple ID</h1>
        <p class="subtitle">Use your Apple ID to access iCloud, App Store, and more.</p>

        <form>
            <div class="field-wrap">
                <label for="apple-id">Apple ID</label>
                <input id="apple-id" type="email" placeholder="name@example.com" autocomplete="email" required>
            </div>

            <div class="field-wrap">
                <label for="password">Password</label>
                <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
            </div>

            <div class="row">
                <label class="remember">
                    <input type="checkbox">
                    Keep me signed in
                </label>
                <a href="#">Forgot password?</a>
            </div>

            <button class="submit" type="submit">Continue</button>
        </form>

        <p class="create">Do not have an Apple ID? <a href="#">Create yours now.</a></p>
    </main>
</body>
</html>
